name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Swift version
        run: swift --version
      - name: Test usage parsing and rate-limit handling
        run: swift test
      - name: Build the macOS app
        run: ./scripts/build.sh
      - name: Verify the bundle and scripts
        run: |
          codesign --verify --deep --strict "build/Usage Bar.app"
          plutil -lint "build/Usage Bar.app/Contents/Info.plist"
          bash -n scripts/build.sh scripts/install.sh
